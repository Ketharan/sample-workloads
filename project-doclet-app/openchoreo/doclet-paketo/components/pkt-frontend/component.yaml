apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: "pkt-frontend"
  namespace: default
spec:
  autoDeploy: true
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  owner:
    projectName: "doclet-paketo"
  workflow:
    kind: ClusterWorkflow
    name: "paketo-buildpacks-builder"
    parameters:
      buildEnv:
        - name: BP_NODE_RUN_SCRIPTS
          value: build
        - name: BP_WEB_SERVER
          value: nginx
        - name: BP_WEB_SERVER_ROOT
          value: dist
        - name: BP_WEB_SERVER_ENABLE_PUSH_STATE
          value: "true"
        - name: VITE_BASE_PATH
          value: "/pkt-frontend-webapp/"
        - name: VITE_DOC_SERVICE_URL
          value: "http://development-default.openchoreoapis.localhost:19080/pkt-document-api"
        - name: VITE_COLLAB_WS_URL
          value: "ws://development-default.openchoreoapis.localhost:19080/pkt-collab-ws/ws"
      repository:
        appPath: "/project-doclet-app/webapp-react-frontend"
        revision:
          branch: "doclet-paketo-buildpacks"
        url: "https://github.com/Ketharan/sample-workloads"
