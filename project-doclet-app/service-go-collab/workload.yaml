apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: collab-service

# Buildpack topology: no nginx proxy, so the browser opens the WebSocket directly.
endpoints:
  - name: ws
    port: 8090
    type: Websocket
    visibility:
      - external

dependencies:
  endpoints:
    - component: pkt-nats
      name: tcp
      visibility: project
      envBindings:
        address: NATS_ADDR

configurations:
  env:
    - name: DOCLET_COLLAB_ADDR
      value: ":8090"
    - name: DOCLET_NATS_URL
      value: "nats://pkt-nats:4222"
