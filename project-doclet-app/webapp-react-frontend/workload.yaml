apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: frontend

# Buildpack topology: the app is served by `serve` (see package.json start script),
# not nginx, so there is no /api and /ws reverse proxy. The browser talks to the
# document and collab services directly using URLs baked in at build time via
# VITE_DOC_SERVICE_URL / VITE_COLLAB_WS_URL.
endpoints:
  - name: webapp
    port: 8080
    type: HTTP
    visibility:
      - external

# Declared for ordering and topology; the URLs themselves are build-time values.
dependencies:
  endpoints:
    - component: gcp-document
      name: api
      visibility: project
      envBindings:
        address: DOC_SERVICE_ADDR
    - component: gcp-collab
      name: ws
      visibility: project
      envBindings:
        address: COLLAB_SERVICE_ADDR
