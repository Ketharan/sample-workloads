apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: document-service

# Buildpack topology: there is no nginx proxy in front of this service, so the
# browser calls it directly and the endpoint must be reachable from outside.
endpoints:
  - name: api
    port: 8080
    type: HTTP
    visibility:
      - external

dependencies:
  endpoints:
    # Each envBindings target must be a distinct env var name: `_` is a throwaway
    # placeholder and two of them collide as duplicate container env entries.
    - component: doclet-postgres
      name: postgres
      visibility: project
      envBindings:
        address: POSTGRES_ADDR
    - component: doclet-nats
      name: nats
      visibility: project
      envBindings:
        address: NATS_ADDR

configurations:
  env:
    - name: DOCLET_DOCUMENT_ADDR
      value: ":8080"
    # Composed URIs are set literally: dependency envBindings inject the resolved
    # address only, and there is no $(VAR) interpolation between env values.
    - name: DOCLET_DATABASE_URL
      value: "postgres://doclet:doclet@doclet-postgres:5432/doclet?sslmode=disable"
    - name: DOCLET_NATS_URL
      value: "nats://doclet-nats:4222"
